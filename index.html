<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Defense in depth: the app builds its DOM with innerHTML, so if an
       escaping slip ever ships, this keeps injected markup from running
       script or phoning out. 'unsafe-inline' for styles only: the progress
       bar and forecast set style attributes (style-src-attr would be
       cleaner, but older Safari ignores it and would break the bars). -->
  <!-- connect-src also allows apps.ncagr.gov: the License tab looks a license
       up against the NC Dept. of Agriculture public search there. It is the
       only host the app ever contacts. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://apps.ncagr.gov; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="description" content="Practice questions and spaced-repetition study tool for the North Carolina pesticide applicator certification exams.">
  <link rel="canonical" href="https://nc-pesticide.ullberg.io/">
  <title>NC Pesticide Trainer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#9c4a12">
  <link rel="stylesheet" href="css/engine.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <nav aria-label="Main">
    <span class="brand">NC Pesticide Trainer</span>
    <a href="#home" data-view="home" class="active" aria-current="page">Home</a>
    <a href="#study" data-view="study">Study</a>
    <a href="#misses" data-view="misses">Misses</a>
    <a href="#exam" data-view="exam">Exam</a>
    <a href="#browse" data-view="browse">Browse</a>
    <a href="#stats" data-view="stats">Stats</a>
    <a href="#license" data-view="license">License</a>
    <a href="#settings" data-view="settings">Settings</a>
    <a href="#about" data-view="about">About</a>
  </nav>
  <main id="view"></main>
  <footer>
    <span id="version"></span>
    <!-- href is filled from the exam config at boot -->
    <a id="repolink" target="_blank" rel="noopener">GitHub</a>
  </footer>
  <script src="data/questions.js" defer></script>
  <!-- Calculation drill templates, and the engine that materializes them into
       the bank. Loaded here, before anything reads QUESTION_BANK, so every
       view below sees one bank with the drills already in it. -->
  <script src="data/problems.js" defer></script>
  <script src="js/problems.js" defer></script>
  <script src="data/manual-pages.js" defer></script>
  <script src="data/aerial-pages.js" defer></script>
  <script src="data/law-pages.js" defer></script>
  <script src="data/rules-pages.js" defer></script>
  <script src="data/ncsu-anchors.js" defer></script>
  <script src="data/recert-credits.js" defer></script>
  <script src="data/exam-config.js" defer></script>
  <script src="js/fsrs.js" defer></script>
  <script src="js/readiness.js" defer></script>
  <script src="js/storage.js" defer></script>
  <script src="js/calculator.js" defer></script>
  <script src="js/license.js" defer></script>
  <script src="js/license-view.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
